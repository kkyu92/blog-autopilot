# AptSignal — 부동산·청약 블로그
# Source: 신규 작성 (paperclip의 AptSignal Lead는 MoneyBall MLB 모드로 outdated)

niche:
  code: AS
  name: AptSignal
  description: 부동산·청약 전문 블로그
  language: ko

platform:
  type: blogger
  site: apt-signal.blogspot.com
  oauth_env_prefix: GOOGLE
  blogger_publish_2step: true  # 영문 slug POST → 한국어 title PUT
  env_vars:
    refresh_token: GOOGLE_REFRESH_TOKEN
    blog_id: GOOGLE_BLOG_ID
    client_id: GOOGLE_CLIENT_ID
    client_secret: GOOGLE_CLIENT_SECRET
    blog_url: GOOGLE_BLOG_URL
    redirect_uri: GOOGLE_REDIRECT_URI

content:
  daily_post_count: 3
  min_word_count: 1200
  max_word_count: 3000
  required_sections:
    - hook
    - h2_sections
    - conclusion
    - cta
    - faq
  required_data_citations: true  # 부동산은 통계·정책 인용 필수
  image_count:
    min: 2
    recommended: 3
  chart_recommended: high  # 부동산은 차트 권장 비율 높음 (시세·정책 비교)
  chart_max_per_post: 3

categories:
  - name: 청약
    weight: 25
    examples: [1순위 조건, 특별공급, 신혼부부, 생애최초, 청약가점, 추첨제]
    ymyl: true  # 금융·법률성 정보

  - name: 매매·전세·월세
    weight: 20
    examples: [실거래가, 시세 동향, 전세 매매 비교, 월세 시장, 가격 전망]
    ymyl: true

  - name: 부동산 정책
    weight: 15
    examples: [LTV, DTI, DSR, 대출 규제, 분양가 상한제, 토지거래허가]
    ymyl: true

  - name: 부동산 세금
    weight: 10
    examples: [취득세, 양도세, 종부세, 재산세, 증여세, 1세대1주택]
    ymyl: true

  - name: 재건축·재개발
    weight: 10
    examples: [재건축 안전진단, 조합원, 분담금, 입주권, 사업시행]

  - name: 신도시·택지지구
    weight: 5
    examples: [3기 신도시, 분양 일정, 광역교통, GTX 노선, 택지 분양]

  - name: 임대·임차
    weight: 5
    examples: [전입신고, 확정일자, 임대차보호법, 갱신청구권, 보증금]
    ymyl: true

  - name: 부동산 투자
    weight: 5
    examples: [수익률 계산, 갭투자, 임대수익, 오피스텔, 상가 투자]
    ymyl: true

  - name: 인테리어·리모델링
    weight: 5
    examples: [원룸 인테리어, 리모델링 비용, 셀프 인테리어, 가구 배치, 화이트톤]

publishing:
  slot_pool: ["09:00", "11:00", "13:00", "15:00", "17:00", "19:00"]
  slots_per_day: 3
  slot_selection: random
  timezone: Asia/Seoul
  rule: 예약발행만 허용. 즉시 발행 금지. 슬롯당 1건.

quality:
  framework: Google E-E-A-T
  ymyl_caution: |
    부동산 카테고리 대부분 YMYL. 정책·세금·법률은 정보 제공 수준만.
    "투자 추천" 형 표현 금지. 모든 글에 면책 문구 필수.
    출처 명시 의무 (국토부·한국부동산원·은행연합회 등).
  spam_prevention: 색인 품질·체류 시간 우선
  min_quality_score: 85  # AS는 YMYL 비중 높아 더 엄격 (WS·TS는 80)
  max_revision_attempts: 2
  required_disclaimers:
    - 본 정보는 일반적 안내이며 투자·법률 자문이 아닙니다
    - 정책·세제는 변경될 수 있으니 발표일 기준 최신 정보 확인 필요
  required_citations:
    - 정책·통계 인용 시 출처 URL·발표일 명시
    - 시세 인용 시 데이터 시점 명시

dedup:
  default_window_days: 30
  evergreen_window_days: 90  # 청약·세금 같은 안정 주제 길게
  evergreen_keywords:
    - 청약 1순위 조건
    - 양도세 계산
    - 전세 vs 매매
    - 종부세 계산
    - 임대차보호법
  policy_freshness_days: 14  # 정책 변경 시 14일 내 재발행 허용 (예외)
  similar_title_threshold: 0.8

trend_hunter:
  category_distribution_max: 30
  trending_to_evergreen_ratio: 5:5  # 부동산은 정책 트렌드와 evergreen 균형
  use_seasonal_calendar: true
  seasonal_boost_multiplier: 1.2
  sources:
    - google_trends_kr
    - naver_realtime_search
    - 국토부_보도자료  # 추가 — 정책 변경 즉시 반응
    - 한국부동산원_시세_업데이트  # 추가
