name: Daily Check

# KST 07:17 매일 — 오늘 12게시물 달성 검증. 부족 시 자동 보충 dispatch.
# auto-publish cron(KST 01:17) 후 ~6시간 뒤. 보충 dispatch 의 90~120min 대기 포함.

on:
  schedule:
    - cron: '17 22 * * *'  # UTC 22:17 = KST 07:17
  workflow_dispatch: {}

jobs:
  check:
    runs-on: [self-hosted, home]
    timeout-minutes: 150  # 3 fill dispatches × 30min + buffer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Daily check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm tsx scripts/daily-check.ts

      - name: GSC daily fetch (Phase 2 — monetization closed loop)
        continue-on-error: true  # GSC fetch fail 해도 daily-check 결과 보존
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
        run: node scripts/gsc-fetch.mjs --days=1
