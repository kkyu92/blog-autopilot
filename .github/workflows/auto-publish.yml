name: Auto-publish

on:
  schedule:
    - cron: '17 16 * * *'  # 매일 KST 01:17 (UTC 16:17) — paperclip 시절 패턴, 외부 API 트래픽 한가
  workflow_dispatch:
    inputs:
      niche:
        description: '대상 niche (all | HS | TS | AS)'
        type: choice
        options: [all, HS, TS, AS]
        default: all
      slot_count:
        description: 'niche당 슬롯 수'
        type: string
        default: '5'
      mode:
        description: '실행 모드'
        type: choice
        options: [normal, healthcheck-only]
        default: normal
      runner:
        description: '실행 runner (cron은 home 고정, dispatch에서 선택)'
        type: choice
        options: [home, office]
        default: home

jobs:
  publish:
    # cron 발동 시 inputs.runner는 빈 문자열 → 'home' fallback (paperclip 환경 재사용)
    # workflow_dispatch 시 사용자 선택 (home / office)
    runs-on: [self-hosted, "${{ inputs.runner || 'home' }}"]
    timeout-minutes: 180  # 9 slots × ~18min/slot (4/27 자연 cron 측정 기준 — 90min은 부족, SIGKILL 유발). 향후 병렬화로 단축 검토
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # E: 세션 시작 마커 — cancel cleanup이 expected vs actual 비교 가능
      - id: session
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "expected_slots=$(( ${{ inputs.slot_count || '5' }} * 3 ))" >> "$GITHUB_OUTPUT"

      - id: publish
        # F1'-e: file descriptor 한도 256 → 10240. 9 slots × niche간 병렬 시 누적 spawn fd 256 도달 위험
        # (ulimit -n 256은 macOS 기본). 4/28·4/29 fail의 H1 root cause 직접 mitigation.
        run: |
          ulimit -n 10240
          echo "[ulimit] file descriptors: $(ulimit -n)"
          pnpm tsx scripts/auto-publish.ts --niche=${{ inputs.niche || 'all' }} --slot-count=${{ inputs.slot_count || '5' }} --mode=${{ inputs.mode || 'normal' }}
        env:
          # 외부 이미지 API
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # 국토교통부 실거래가 API (AS 니치 실데이터 주입)
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}

          # WordPress 멀티사이트 (WS / TS)
          # healthcheck.ts + tokens.ts 가 사용하는 실제 키 이름
          WORDPRESS_WS_ACCESS_TOKEN: ${{ secrets.WORDPRESS_WS_ACCESS_TOKEN }}
          WORDPRESS_WS_BLOG_ID: ${{ secrets.WORDPRESS_WS_BLOG_ID }}
          WORDPRESS_WS_CLIENT_ID: ${{ secrets.WORDPRESS_WS_CLIENT_ID }}
          WORDPRESS_WS_CLIENT_SECRET: ${{ secrets.WORDPRESS_WS_CLIENT_SECRET }}
          WORDPRESS_WS_SITE: ${{ secrets.WORDPRESS_WS_SITE }}
          WORDPRESS_WS_CATEGORY_ID: ${{ secrets.WORDPRESS_WS_CATEGORY_ID }}
          WORDPRESS_TS_ACCESS_TOKEN: ${{ secrets.WORDPRESS_TS_ACCESS_TOKEN }}
          WORDPRESS_TS_BLOG_ID: ${{ secrets.WORDPRESS_TS_BLOG_ID }}
          WORDPRESS_TS_CLIENT_ID: ${{ secrets.WORDPRESS_TS_CLIENT_ID }}
          WORDPRESS_TS_CLIENT_SECRET: ${{ secrets.WORDPRESS_TS_CLIENT_SECRET }}
          WORDPRESS_TS_SITE: ${{ secrets.WORDPRESS_TS_SITE }}
          WORDPRESS_TS_CATEGORY_ID: ${{ secrets.WORDPRESS_TS_CATEGORY_ID }}

          # Blogger 멀티블로그 (AS / TS / WS) — 5/5 WP→Blogger 마이그레이션 후
          # 도메인 일관 명명: APT (apt-signal), TRIP (trip-signal), HEALTH (health-signal).
          # GOOGLE_BLOG_ID 는 backward-compat fallback (AS only). 신규 cron 부터는 _APT 사용.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_BLOG_ID: ${{ secrets.GOOGLE_BLOG_ID }}
          GOOGLE_BLOG_ID_APT: ${{ secrets.GOOGLE_BLOG_ID_APT }}
          GOOGLE_BLOG_ID_TRIP: ${{ secrets.GOOGLE_BLOG_ID_TRIP }}
          GOOGLE_BLOG_ID_HEALTH: ${{ secrets.GOOGLE_BLOG_ID_HEALTH }}

          # DB / 백업 (self-hosted runner의 영속 경로)
          DATABASE_PATH: ${{ secrets.DATABASE_PATH }}

          # Issue dispatch (auto-publish.ts queue_exhausted / publish_failed)
          # GITHUB_REPOSITORY는 Actions 가 자동 주입하지만 명확성 위해 유지
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # E: silent fail 방지 — 워크플로우 cancel(=timeout) 시 운영자에게 알림 issue 생성.
      # 4/27 자연 cron이 90min timeout으로 cancel되면서 4 슬롯이 silent fail이 된 사례 방지.
      # always() if cancelled() 로 publish step의 cancel 후에도 실행됨.
      - name: Notify on cancellation (silent fail prevention)
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          STARTED_AT="${{ steps.session.outputs.started_at }}"
          EXPECTED="${{ steps.session.outputs.expected_slots }}"
          RUN_URL="https://github.com/${GH_REPO}/actions/runs/${{ github.run_id }}"
          BODY=$(cat <<EOF
          **Silent fail risk detected** — auto-publish workflow was cancelled before completion.

          - Run: ${RUN_URL}
          - Started at (UTC): ${STARTED_AT}
          - Expected slots: ${EXPECTED}
          - Likely cause: \`timeout-minutes\` 도달 (현재 180min) 또는 수동 cancel

          **다음 작업:**
          1. \`gh run view ${{ github.run_id }} --log\` — 어느 슬롯에서 끊겼는지 확인
          2. \`sqlite3 \$DATABASE_PATH "SELECT id, niche, keyword, status, published_at FROM published_posts WHERE published_at >= '${STARTED_AT}' ORDER BY id DESC"\` — 실제 발행/실패 row 확인
          3. expected(${EXPECTED}) vs actual count 차이만큼이 silent fail
          4. 미처리 niche/slot은 manual workflow_dispatch로 회수
          EOF
          )
          gh issue create \
            --title "[blog-autopilot] 🚨 cron cancelled — silent fail risk (run #${{ github.run_id }})" \
            --label "blog-autopilot,silent-fail" \
            --body "$BODY"
