name: Token Monitor — Blogger

on:
  schedule:
    # 매일 KST 18:17 (UTC 09:17) — auto-publish 17분 미러링
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Blogger refresh_token
        env:
          GH_TOKEN: ${{ secrets.PLAYBOOK_PAT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -e

          dispatch() {
            local title="$1"
            local body="$2"
            local severity="$3"
            local fingerprint="$4"
            gh api repos/kkyu92/playbook/dispatches \
              -f event_type=worker-incident \
              -f "client_payload[source_repo]=${GITHUB_REPOSITORY}" \
              -f "client_payload[title]=${title}" \
              -f "client_payload[body]=${body}" \
              -f "client_payload[type]=incident" \
              -f "client_payload[severity]=${severity}" \
              -f "client_payload[fingerprint]=${fingerprint}" \
              -f "client_payload[environment]=production" \
              -f "client_payload[run_url]=${RUN_URL}"
          }

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TODAY=$(date -u +%Y-%m-%d)

          if [ -z "$GOOGLE_REFRESH_TOKEN" ] || [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            dispatch \
              "Blogger 토큰 모니터: env 누락" \
              "GOOGLE_REFRESH_TOKEN / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET 중 하나 이상 누락.

          조치: GitHub Secrets 확인 및 갱신.
          Runbook: https://github.com/kkyu92/blog-autopilot/blob/main/docs/runbook/blogger-token-renewal.md

          Run: ${RUN_URL}" \
              "critical" \
              "blogger-env-missing-${TODAY}"
            exit 0
          fi

          probe_blogger() {
            curl -s -X POST https://oauth2.googleapis.com/token \
              --max-time 10 \
              -d "client_id=${GOOGLE_CLIENT_ID}" \
              -d "client_secret=${GOOGLE_CLIENT_SECRET}" \
              -d "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
              -d "grant_type=refresh_token"
          }

          RESP=$(probe_blogger)
          echo "Probe response (first 200 chars): ${RESP:0:200}"

          if echo "$RESP" | grep -q '"access_token"'; then
            echo "Blogger: ok"
            exit 0
          fi

          # invalid_grant → 즉시 critical
          if echo "$RESP" | grep -q "invalid_grant"; then
            dispatch \
              "Blogger refresh_token 무효 (invalid_grant)" \
              "GOOGLE_REFRESH_TOKEN 이 invalid_grant 응답. 다음 KST 01:17 cron 에서 3 niche 전체 발행 fail.

          조치:
          1. Runbook 참조: https://github.com/kkyu92/blog-autopilot/blob/main/docs/runbook/blogger-token-renewal.md
          2. 로컬에서 재인증: node --env-file=.env.local scripts/mid-review/reauth.mjs
          3. GOOGLE_REFRESH_TOKEN secret 갱신 후 workflow_dispatch 로 검증

          Run: ${RUN_URL}" \
              "critical" \
              "blogger-token-dead-${TODAY}"
            exit 0
          fi

          # 네트워크 오류 등 → 30초 후 1회 재시도
          echo "First probe failed (non-invalid_grant). Retrying in 30s..."
          sleep 30

          RESP2=$(probe_blogger)
          echo "Retry response (first 200 chars): ${RESP2:0:200}"

          if echo "$RESP2" | grep -q '"access_token"'; then
            echo "Blogger: ok (retry)"
            exit 0
          fi

          dispatch \
            "Blogger token probe 실패 (네트워크 또는 알 수 없는 오류)" \
            "2회 시도 후 access_token 응답 없음. invalid_grant 아님 — 일시적 Google OAuth 장애 가능성.

          응답 첫 200자: ${RESP2:0:200}

          조치: 30분 후 workflow_dispatch 로 재확인. 반복 시 Runbook 참조.
          Runbook: https://github.com/kkyu92/blog-autopilot/blob/main/docs/runbook/blogger-token-renewal.md

          Run: ${RUN_URL}" \
            "warning" \
            "blogger-probe-unknown-${TODAY}"

      - name: Notify playbook on workflow-level failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PLAYBOOK_PAT }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          gh api repos/kkyu92/playbook/dispatches \
            -f event_type=worker-error \
            -f "client_payload[source_repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[title]=${WORKFLOW_NAME} 워크플로 자체 실패" \
            -f "client_payload[body]=Workflow: ${WORKFLOW_NAME}
          Run: ${RUN_URL}
          (probe step 내부 예상치 못한 종료 — 토큰 자체 문제일 가능성 있음)" \
            -f "client_payload[type]=error-log" \
            -f "client_payload[severity]=error" \
            -f "client_payload[fingerprint]=cron-token-monitor-blogger-failure" \
            -f "client_payload[environment]=production" \
            -f "client_payload[run_url]=${RUN_URL}"
